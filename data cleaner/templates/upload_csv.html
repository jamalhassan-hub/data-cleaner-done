{% extends "base.html" %}
{% block content %}
<h1>Upload CSV / Excel File</h1>
<div class="card">
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv, .xlsx" required style="color: #fff; margin-bottom: 15px; display: block;"><br>
        <button type="submit" class="btn">Clean & Process File</button>
    </form>
</div>
{% endblock %}
